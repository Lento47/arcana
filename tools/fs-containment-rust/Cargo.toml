[package]
name = "fs-containment"
version = "0.1.0"
edition = "2021"
description = "D-7.1: Linux kernel-enforced filesystem containment via openat2"

[dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"
