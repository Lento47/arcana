[package]
name = "acep-conformance"
version = "0.1.0"
edition = "2021"
description = "ACEP-1 cross-runtime conformance verifier"

[dependencies]
ed25519-dalek = { version = "2", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
regex = "1"

[dev-dependencies]
