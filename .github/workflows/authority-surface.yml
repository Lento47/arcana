name: Authority Surface

on:
  pull_request:
    branches:
      - arcanagov
  push:
    branches:
      - arcanagov
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: authority-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  authority-surface:
    name: Authority Surface gate (K0)
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Static scan needs no dependencies; install only what bun test requires.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Static authority scan (structure claim)
        run: bun run script/authority-scan.ts

      - name: Authority Kernel process-gate tests (M1)
        run: bun test packages/core/src/capability/process-gate.test.ts

      - name: Authority Kernel fs-gate tests (M1)
        run: bun test packages/core/src/capability/fs-gate.test.ts

      - name: Authority Kernel network-gate tests (M1)
        run: bun test packages/core/src/capability/network-gate.test.ts

      - name: Authority Kernel secret-gate tests (M1)
        run: bun test packages/core/src/capability/secret-gate.test.ts

      - name: Authority Kernel K3a replay suite
        run: bun test packages/core/src/capability/replay-k3a.test.ts

      - name: Authority Kernel effect-claim tests (K4)
        run: bun test packages/core/src/capability/effect-claim.test.ts

      - name: Authority Kernel K5 performance SLOs (fail-closed)
        run: bun run authority:bench

      - name: Run Scorecard tests (K6)
        run: bun test packages/arcana/src/agent/run-scorecard.test.ts

      - name: Dynamic authority audit (exercised-path claim)
        run: bun run script/authority-dynamic.ts
