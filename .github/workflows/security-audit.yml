name: Security Audit

on:
  schedule:
    - cron: "0 7 * * 1" # Every Monday 7am UTC
  push:
    branches: [master]
    paths:
      - "bun.lock"
      - "package.json"
      - "packages/*/package.json"
  pull_request:
    branches: [master]
    paths:
      - "bun.lock"
      - "package.json"
      - "packages/*/package.json"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install

      - name: Generate SBOM (CycloneDX)
        run: |
          bun x @cyclonedx/cyclonedx-npm --output-file arcana-sbom.json --spec-version 1.5 || echo "SBOM generation skipped (tool not available)"
        continue-on-error: true

      - name: Upload SBOM
        if: hashFiles('arcana-sbom.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: arcana-sbom.json
          retention-days: 90

      - name: Run npm audit
        run: |
          echo "## Dependency Audit" >> $GITHUB_STEP_SUMMARY
          bun audit --json 2>/dev/null || true
          # Check for high/critical advisories
          VULNS=$(npm audit --json 2>/dev/null | node -e "const d=require('fs').readFileSync('/dev/stdin','utf8');try{const j=JSON.parse(d);const c=(j.metadata?.vulnerabilities?.critical||0)+(j.metadata?.vulnerabilities?.high||0);console.log(c)}catch(e){console.log(0)}")
          echo "High+Critical vulns: $VULNS"
          echo "- High+Critical advisories: $VULNS" >> $GITHUB_STEP_SUMMARY
          if [ "$VULNS" -gt 0 ]; then
            echo "::warning::Found $VULNS high/critical vulnerabilities. Review in Security tab."
          fi
        continue-on-error: true

      - name: Check OSSF Scorecard
        # Skipped — requires public repo. Enable when repo visibility changes.
        if: false
        run: echo "Scorecard skipped (private repo)"

  dependabot:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - name: Summary
        run: |
          echo "## Dependabot Status" >> $GITHUB_STEP_SUMMARY
          echo "Check the Security tab for open advisories:" >> $GITHUB_STEP_SUMMARY
          echo "https://github.com/${{ github.repository }}/security/dependabot" >> $GITHUB_STEP_SUMMARY
