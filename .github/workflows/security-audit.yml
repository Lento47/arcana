name: Security Audit

on:
  schedule:
    - cron: "0 7 * * 1" # Every Monday 7am UTC
  push:
    branches: [master]
    paths:
      - "bun.lock"
      - "package.json"
      - "packages/*/package.json"
  pull_request:
    branches: [master]
    paths:
      - "bun.lock"
      - "package.json"
      - "packages/*/package.json"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install

      - name: Generate SBOM (CycloneDX)
        run: |
          bun x @cyclonedx/cyclonedx-npm --output-file arcana-sbom.json --spec-version 1.5 || echo "SBOM generation skipped (tool not available)"
        continue-on-error: true

      - name: Upload SBOM
        if: hashFiles('arcana-sbom.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: arcana-sbom.json
          retention-days: 90

      - name: Run dependency audit
        # Use Bun's lockfile-aware audit directly. High/critical advisories
        # fail master pushes and the weekly schedule; PRs remain soft-warning.
        id: audit
        shell: bash
        run: |
          set -euo pipefail
          echo "## Dependency Audit" >> "$GITHUB_STEP_SUMMARY"

          set +e
          AUDIT_OUTPUT="$(bun audit --audit-level=high 2>&1)"
          AUDIT_EXIT=$?
          set -e

          printf '%s\n' "$AUDIT_OUTPUT"
          if (( AUDIT_EXIT == 0 )); then
            echo "- High/critical dependency audit: clean" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- High/critical dependency audit: attention required" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::bun audit reported high/critical vulnerabilities or failed to complete."
            # Block the build on master pushes and the weekly schedule; allow
            # PRs to proceed with a soft warning so contributors aren't blocked
            # by upstream advisories.
            if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "schedule" ]; then
              echo "::error::Dependency audit failed on master/schedule; inspect the audit output above." >&2
              exit "$AUDIT_EXIT"
            fi
          fi

      - name: Open issue on high/critical advisories
        if: failure() && (github.event_name == 'push' || github.event_name == 'schedule')
        uses: actions/github-script@v7
        with:
          script: |
            // Dedupe: only one open issue per day per vuln set.
            const today = new Date().toISOString().slice(0, 10);
            const title = `[security-audit] High/critical advisories — ${today}`;
            const existing = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:open is:issue in:title "[security-audit]"`
            });
            if (existing.data.total_count > 0) {
              core.info("Open security-audit issue already exists; skipping");
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: "Automated report from the security-audit workflow. See the failed run for details.\n\nRun: ${{ github.run_id }}",
              labels: ["security", "automated"]
            });

      - name: Check OSSF Scorecard
        # Skipped — requires public repo. Enable when repo visibility changes.
        if: false
        run: echo "Scorecard skipped (private repo)"

  dependabot:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - name: Summary
        run: |
          echo "## Dependabot Status" >> $GITHUB_STEP_SUMMARY
          echo "Check the Security tab for open advisories:" >> $GITHUB_STEP_SUMMARY
          echo "https://github.com/${{ github.repository }}/security/dependabot" >> $GITHUB_STEP_SUMMARY
