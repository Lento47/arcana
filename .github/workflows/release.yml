name: Release

# Trigger: manual or "bump" comment on commit
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        type: choice
        options: [patch, minor, major]
        default: patch

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Bump version and tag
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          # Read current version from npm package
          VERSION=$(node -p "require('./packages/arcana/npm/package.json').version")
          echo "Current version: $VERSION"

          # Split version
          MAJOR=$(echo $VERSION | cut -d. -f1)
          MINOR=$(echo $VERSION | cut -d. -f2)
          PATCH=$(echo $VERSION | cut -d. -f3)

          BUMP="${{ inputs.bump }}"
          case $BUMP in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "New version: $NEW_VERSION"

          # Update version in files
          cd packages/arcana/npm
          npm version "$NEW_VERSION" --no-git-tag-version
          cd ../../..
          # Also track version in root for reference
          node -p "const p=require('./package.json');p.version='$NEW_VERSION';JSON.stringify(p,null,2)" > /tmp/pkg.json
          cat /tmp/pkg.json > package.json
          # Update launcher VERSION constant
          sed -i "s/const VERSION = \"[^\"]*\"/const VERSION = \"v$NEW_VERSION\"/" packages/arcana/npm/bin/arcana.js

          TAG="v$NEW_VERSION"

          git commit -am "release: bump to $TAG"
          git tag "$TAG"
          git push origin master
          git push origin "$TAG"
          echo "Published $TAG"
