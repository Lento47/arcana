name: Release

# Trigger: manual or "bump" comment on commit
on:
  push:
    branches: [master, arcanagov]
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        type: choice
        options: [patch, minor, major]
        default: patch

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.WORKFLOW_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Gate release tag on ACEP-1 conformance
        run: bun run conformance --json --output conformance-release-candidate.json

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Bump version and create release candidate
        env:
          RELEASE_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          # Detect bump level from commit message or workflow input
          BUMP="${{ inputs.bump }}"
          if [ -z "$BUMP" ]; then
            MSG=$(git log -1 --format=%B)
            if echo "$MSG" | grep -qE '\[bump major\]|bump:major'; then
              BUMP="major"
            elif echo "$MSG" | grep -qE '\[bump minor\]|bump:minor'; then
              BUMP="minor"
            elif echo "$MSG" | grep -qE '\[bump\]|bump:patch|\[bump patch\]|\[release\]'; then
              BUMP="patch"
            else
              echo "No bump directive in commit message — skipping release"
              exit 0
            fi
          fi
          echo "Bump level: $BUMP"

          # Read current version from npm package
          VERSION=$(node -p "require('./packages/arcana/package.json').version")
          echo "Current version: $VERSION"

          # Split and bump
          MAJOR=$(echo $VERSION | cut -d. -f1)
          MINOR=$(echo $VERSION | cut -d. -f2)
          PATCH=$(echo $VERSION | cut -d. -f3)
          case $BUMP in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "New version: $NEW_VERSION"

          # Update version in all files
          node -p "const p=require('./packages/arcana/package.json');p.version='$NEW_VERSION';JSON.stringify(p,null,2)" > /tmp/arcana-pkg.json
          cat /tmp/arcana-pkg.json > packages/arcana/package.json
          node -p "const p=require('./package.json');p.version='$NEW_VERSION';JSON.stringify(p,null,2)" > /tmp/pkg.json
          cat /tmp/pkg.json > package.json
          node -p "const p=require('./packages/engine/package.json');p.version='$NEW_VERSION';JSON.stringify(p,null,2)" > /tmp/engine-pkg.json
          cat /tmp/engine-pkg.json > packages/engine/package.json
          node -p "const p=require('./packages/tui/package.json');p.version='$NEW_VERSION';JSON.stringify(p,null,2)" > /tmp/tui-pkg.json
          cat /tmp/tui-pkg.json > packages/tui/package.json
          node -p "const p=require('./packages/arcana/npm/package.json');p.version='$NEW_VERSION';JSON.stringify(p,null,2)" > /tmp/npm-pkg.json
          cat /tmp/npm-pkg.json > packages/arcana/npm/package.json
          sed -i "s/const VERSION = \"v[^\"]*\"/const VERSION = \"v$NEW_VERSION\"/" packages/arcana/npm/bin/arcana.js

          STABLE_TAG="v$NEW_VERSION"

          git commit -am "release: prepare $STABLE_TAG candidate"
          # Rebase before creating the candidate tag so it points at the final candidate commit.
          git pull --rebase origin "$RELEASE_BRANCH"
          git fetch origin --tags
          LAST_RC=$(git tag --list "$STABLE_TAG-rc.*" --sort=-version:refname | head -n 1)
          if [ -z "$LAST_RC" ]; then
            RC_NUMBER=1
          else
            RC_NUMBER=$(( ${LAST_RC##*.} + 1 ))
          fi
          CANDIDATE_TAG="$STABLE_TAG-rc.$RC_NUMBER"
          git tag -a "$CANDIDATE_TAG" -m "Release candidate $CANDIDATE_TAG"
          # Publish the candidate commit and tag together so neither can land without the other.
          git push --atomic origin "HEAD:$RELEASE_BRANCH" "$CANDIDATE_TAG" || {
            echo "Failed to atomically push release candidate — another release may be in progress"
            git tag -d "$CANDIDATE_TAG" 2>/dev/null || true
            exit 1
          }
          echo "Tagged $CANDIDATE_TAG — stable publication requires imported L3/L4 evidence and promotion"
