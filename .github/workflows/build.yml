name: Build arcana

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies (all platforms for cross-compile)
        run: |
          bun install
          bun install --os="*" --cpu="*"

      - name: Build arcana binaries
        env:
          OPENCODE_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') && '1' || '' }}
        run: bun run --cwd packages/opencode script/build.ts --skip-embed-web-ui

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packages/opencode/dist/*.zip
            packages/opencode/dist/*.tar.gz
