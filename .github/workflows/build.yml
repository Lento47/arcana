name: Build arcana

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies (all platforms for cross-compile)
        run: |
          bun install
          bun install --os="*" --cpu="*"

      - name: Build arcana binaries
        env:
          OPENCODE_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') && '1' || '' }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: "Lento47/arcana"
        run: bun run --cwd packages/opencode script/build.ts --skip-embed-web-ui
