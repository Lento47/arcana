name: CI

on:
  pull_request:
    branches:
      - master
      - phase-d-implementation
  push:
    branches:
      - master
      - phase-d-implementation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  static-analysis:
    name: Static analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run full test suite
        run: |
          set +e
          bun run test 2>&1 | tee full-test.log
          status=${PIPESTATUS[0]}

          if [ "$status" -ne 0 ]; then
            echo "::group::Serial TUI diagnostic rerun"
            bun test packages/tui --max-concurrency=1 2>&1 | tee serial-tui-test.log
            diagnostic_status=${PIPESTATUS[0]}
            echo "::endgroup::"
            echo "::error::The full test suite failed (exit $status). Serial TUI diagnostic exit: $diagnostic_status."
          fi

          exit "$status"

  build-and-release-gates:
    name: Build and release gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: ML evals
        run: bun run ml:eval

      - name: Build M1 runtime and packages
        run: bun turbo build --filter='!@arcana/enterprise'

      - name: Verify version files agree
        # The release pipeline bakes version into the 4 publication files.
        # packages/engine has its own internal version (1.x) — not part of
        # the user-facing release. Drift between the 4 user-facing files
        # would cause broken upgrades; fail loud here before the release
        # step can ship mismatched artifacts.
        run: |
          ROOT=$(node -p "require('./package.json').version")
          ARCANA=$(node -p "require('./packages/arcana/package.json').version")
          NPM=$(node -p "require('./packages/arcana/npm/package.json').version")
          BIN=$(grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' packages/arcana/npm/bin/arcana.js | head -n1 | tr -d 'v')
          echo "root=$ROOT arcana=$ARCANA npm=$NPM bin=$BIN"
          if [ "$ROOT" != "$ARCANA" ] || [ "$ROOT" != "$NPM" ] || [ "$ROOT" != "$BIN" ]; then
            echo "::error::Version files disagree (root=$ROOT, arcana=$ARCANA, npm=$NPM, bin=$BIN)" >&2
            exit 1
          fi

      - name: Repo URL guard
        # Private Lento47/arcana must never appear in published artifacts —
        # the wrapper package would auto-correct its `repository` field and
        # leak the private URL to npm. Only Lento47/arcana-community is allowed.
        run: |
          if grep -RPl "Lento47/arcana\b(?!-)" packages/arcana/npm/ 2>/dev/null \
            | grep -v "Lento47/arcana-community"; then
            echo "::error::Found private repo URL 'Lento47/arcana' in packages/arcana/npm/" >&2
            exit 1
          fi

      - name: Performance regression check
        run: bun run scripts/perf-check.ts --skip-startup

  enterprise-build:
    name: Enterprise build
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build enterprise surface
        run: bun run --cwd packages/enterprise build
