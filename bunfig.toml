# Solid transform for TUI when launching from monorepo root.
# Package-level bunfig is not applied when bun cwd is the repo root.
preload = ["./scripts/tui-solid-preload.ts"]

[install]
exact = true

[install.lockfile]
print = "bun"

[test]
# TUI Solid transform (see comment above) +
# Authority Kernel dynamic-audit wrappers (pass-through; record only when
# ARCANA_AUTHORITY_REPORT is set — see script/authority-dynamic.preload.ts).
preload = ["./scripts/tui-test-preload.ts", "./script/authority-dynamic.preload.ts"]
